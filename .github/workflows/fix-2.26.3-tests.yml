name: Update mDIR-U 2.26.3 release tests

on:
  push:
    branches:
      - review/mdir-u-2.26.3-safety
    paths:
      - .github/workflows/fix-2.26.3-tests.yml

permissions:
  contents: write

jobs:
  update-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update stale installer and version assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_smoke.py')
          text = path.read_text(encoding='utf-8')
          old = '        self.assertIn("--force-reinstall", installer_text)\n'
          new = (
              '        self.assertNotIn("--force-reinstall", installer_text)\n'
              '        self.assertNotIn("--no-cache-dir", installer_text)\n'
              '        self.assertIn("PIP_DISABLE_PIP_VERSION_CHECK=1", installer_text)\n'
          )
          if old not in text:
              raise SystemExit('old force-reinstall assertion not found')
          text = text.replace(old, new, 1)
          old_version = '        self.assertEqual(__version__, "2.26.2")\n'
          if old_version not in text:
              raise SystemExit('old version assertion not found')
          text = text.replace(old_version, '        self.assertEqual(__version__, "2.26.3")\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/fix-2.26.3-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align tests with mDIR-U 2.26.3 safety release"
          git push origin HEAD:review/mdir-u-2.26.3-safety
