name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[preview,dev]"
      - name: Self-check
        run: python -m mdir_u --check
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build package
        run: python -m build
