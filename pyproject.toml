[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdir-u"
version = "2.16.0"
description = "A fast dual-pane Ubuntu and universal terminal file manager with AI and document preview."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "textual>=1.0,<9",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: File Managers",
]

[project.optional-dependencies]
preview = [
    "Pillow>=10.0",
    "PyMuPDF>=1.24",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.scripts]
u = "mdir_u.__main__:main"
U = "mdir_u.__main__:main"
mdir-u = "mdir_u.__main__:main"

[project.urls]
Homepage = "https://github.com/jtl-sun/mdir-u"
Issues = "https://github.com/jtl-sun/mdir-u/issues"

[tool.setuptools.packages.find]
include = ["mdir_u*"]
